# Unused kernel attack surfaces, including the five critical 2026-10-11 matches.
# modprobe install rules also reject explicit loads; blacklist blocks aliases.
# Keep NVMe client, Hyper-V, GVE, NVIDIA and LKCA support.
blacklist nfsd
install nfsd /bin/false
blacklist kvm
install kvm /bin/false
blacklist kvm_amd
install kvm_amd /bin/false
blacklist kvm_intel
install kvm_intel /bin/false
blacklist nvmet
install nvmet /bin/false
blacklist nvmet_tcp
install nvmet_tcp /bin/false
blacklist ib_srpt
install ib_srpt /bin/false
blacklist sctp
install sctp /bin/false
blacklist dccp
install dccp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist ramoops
install ramoops /bin/false
blacklist efi_pstore
install efi_pstore /bin/false

